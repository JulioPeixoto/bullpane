# Bullpane — production-ish. Bring your own Redis: you add connections
# to your BullMQ Redis instances from the dashboard.
#
#   cp .env.example .env   # SESSION_SECRET only matters once you unlock Pro (login)
#   docker compose up -d
#   open http://localhost:3000
#
# The dashboard's own data lives in SQLite on the `bullpane-data` volume — no
# database to run.
#
# Want MySQL instead (more than one replica, or you just prefer it)? Two lines
# in .env, nothing to edit here:
#
#   COMPOSE_PROFILES=mysql                                   # also start the bundled MySQL
#   DATABASE_URL=mysql://bullpane:bullpane@mysql:3306/bullpane
#
# Your own MySQL / RDS: set only DATABASE_URL to it, leave COMPOSE_PROFILES out.

services:
  app:
    build:
      context: .
      target: runner
    image: bullpane:local
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      # Empty = SQLite in /data. mysql://… = MySQL (see the header).
      DATABASE_URL: ${DATABASE_URL:-}
      # Random 32+ char string; signs the session cookie. Do not ship the placeholder.
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Empty = free edition. Paste your Pro key here or in Settings → License.
      BULLPANE_LICENSE_KEY: ${BULLPANE_LICENSE_KEY:-}
      BULLPANE_CHECKOUT_URL: ${BULLPANE_CHECKOUT_URL:-https://bullpane.com/#pricing}
      BULLPANE_QUEUE_DISCOVERY_TTL: ${BULLPANE_QUEUE_DISCOVERY_TTL:-30}
      BULLPANE_ALERTS_INTERVAL: ${BULLPANE_ALERTS_INTERVAL:-15}
      BULLPANE_AUDIT_RETENTION_DAYS: ${BULLPANE_AUDIT_RETENTION_DAYS:-365}
      BULLPANE_JOB_PREVIEW_BYTES: ${BULLPANE_JOB_PREVIEW_BYTES:-2048}
    volumes:
      - bullpane-data:/data
    # No depends_on on mysql: it may not be running at all (profile off), and
    # the app already retries MySQL for 60 s and restarts if it is not up yet.

  mysql:
    # Only started with COMPOSE_PROFILES=mysql (or `docker compose --profile mysql up`).
    profiles: ["mysql"]
    image: mysql:8.4
    restart: unless-stopped
    command: --mysql-native-password=ON --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: bullpane
      MYSQL_USER: bullpane
      MYSQL_PASSWORD: bullpane
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Exposed so `pnpm dev` on the host can reach it; drop in production.
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # Same volume name as before SQLite became the default, so an existing
      # install that turns the profile on finds its data where it left it.
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  bullpane-data:
  mysql-data:
